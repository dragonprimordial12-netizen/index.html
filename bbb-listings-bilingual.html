// ── UI ────────────────────────────────────────────────────────────────────────
function INFO(l,price,cat){
  return l==='es'
    ?`Categoría: Roblox → ${cat} &nbsp;|&nbsp; ${price} &nbsp;|&nbsp; Código abierto: Sí &nbsp;|&nbsp; Sin DRM: Sí &nbsp;|&nbsp; Sin ofuscación: Sí &nbsp;|&nbsp; EN + ES`
    :`Category: Roblox → ${cat} &nbsp;|&nbsp; ${price} &nbsp;|&nbsp; Open source: Yes &nbsp;|&nbsp; DRM-free: Yes &nbsp;|&nbsp; Unobfuscated: Yes &nbsp;|&nbsp; EN + ES`;
}

function lbl(l){return{t:l==='es'?'Título':'Title',s:l==='es'?'Resumen':'Summary',d:l==='es'?'Descripción':'Description'};}

function build(el,data,cls,l){
  data.forEach(item=>{
    const d=item[l];
    const tab=document.createElement('button');
    tab.className=`tab ${cls}`;
    tab.dataset.panel=item.id;
    tab.textContent=item.em+' '+d.title.split(' ').slice(0,2).join(' ');
    tab.onclick=()=>{
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(item.id).classList.add('active');
      activeId=item.id;
    };
    el.appendChild(tab);
    const desc=makeDesc(l,item.em,d.title,d.type,d.intro,d.detail,incl(l,item.model),d.feat,STDBUILD[l],item.pfor[l]);
    const L=lbl(l);
    const div=document.createElement('div');
    div.id=item.id; div.className='panel';
    div.innerHTML=`
      <div class="f"><div class="fl"><span>${L.t}</span><button class="cb" onclick="cp('${item.id}t')">Copy<span class="ok" id="c-${item.id}t">✓</span></button></div><pre id="${item.id}t">${d.title}</pre></div>
      <div class="f"><div class="fl"><span>${L.s}</span><button class="cb" onclick="cp('${item.id}s')">Copy<span class="ok" id="c-${item.id}s">✓</span></button></div><pre id="${item.id}s">${d.sum}</pre></div>
      <div class="f"><div class="fl"><span>${L.d}</span><button class="cb" onclick="cp('${item.id}d')">Copy<span class="ok" id="c-${item.id}d">✓</span></button></div><pre id="${item.id}d">${desc}</pre></div>
      <div class="info">${INFO(l,'$15.00 USD',l==='es'?'Modelos':'Models')}</div>`;
    document.getElementById('P').appendChild(div);
  });
}

function buildScript(l){
  const d=SCRIPT_DATA[l];
  const stab=document.createElement('button');
  stab.className='tab script'; stab.dataset.panel='scriptpanel';
  stab.textContent=l==='es'?'🛠️ Conector Motor6D':'🛠️ Motor6D Connector';
  stab.onclick=()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    stab.classList.add('active');
    document.getElementById('scriptpanel').classList.add('active');
    activeId='scriptpanel';
  };
  document.getElementById('TS').appendChild(stab);
  const L=lbl(l);
  const div=document.createElement('div');
  div.id='scriptpanel'; div.className='panel';
  div.innerHTML=`
    <div class="f"><div class="fl"><span>${L.t}</span><button class="cb" onclick="cp('sct')">Copy<span class="ok" id="c-sct">✓</span></button></div><pre id="sct">${d.title}</pre></div>
    <div class="f"><div class="fl"><span>${L.s}</span><button class="cb" onclick="cp('scs')">Copy<span class="ok" id="c-scs">✓</span></button></div><pre id="scs">${d.sum}</pre></div>
    <div class="f"><div class="fl"><span>${L.d}</span><button class="cb" onclick="cp('scd')">Copy<span class="ok" id="c-scd">✓</span></button></div><pre id="scd">${d.desc}</pre></div>
    <div class="info">${d.info}</div>`;
  document.getElementById('P').appendChild(div);
}

function setLang(l){
  curLang=l;
  document.getElementById('lbl-pure').textContent=LABELS[l].pure;
  document.getElementById('lbl-corrupt').textContent=LABELS[l].corrupt;
  document.getElementById('lbl-boss').textContent=LABELS[l].boss;
  document.getElementById('lbl-npc').textContent=LABELS[l].npc;
  document.getElementById('btn-en').classList.toggle('active',l==='en');
  document.getElementById('btn-es').classList.toggle('active',l==='es');
  ['TP','TC','TJ','TN','TS'].forEach(id=>document.getElementById(id).innerHTML='');
  document.getElementById('P').innerHTML='';
  build(document.getElementById('TP'),PURE,'pure',l);
  build(document.getElementById('TC'),CORRUPT,'corrupt',l);
  build(document.getElementById('TJ'),BOSSES,'boss',l);
  build(document.getElementById('TN'),NPCS,'npc',l);
  buildScript(l);
  const panel=document.getElementById(activeId);
  const tab=document.querySelector(`[data-panel="${activeId}"]`);
  if(panel) panel.classList.add('active');
  if(tab) tab.classList.add('active');
}

function cp(id){
  navigator.clipboard.writeText(document.getElementById(id).textContent).then(()=>{
    const el=document.getElementById('c-'+id);
    if(el){el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2000);}
  });
}
